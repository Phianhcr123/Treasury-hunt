[project]
name = "eom-treasury-rally"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Cursor Agent", email = "cursoragent@cursor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "streamlit>=1.65.0",
    "tabulate>=0.10.0",
    "yfinance>=1.7.0",
]

[project.scripts]
eom-treasury-rally = "eom_treasury_rally:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
